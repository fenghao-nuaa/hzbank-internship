[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "short-term-memory"
version = "0.1.0"
description = "Redis and Headroom short-term memory SDK for agent applications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "redis==6.4.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.141,<1",
  "prometheus-client>=0.23,<1",
  "uvicorn[standard]>=0.52,<1",
]
deepseek = [
  "openai>=2.51,<3",
]
dev = [
  "build>=1,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff==0.15.10",
]

[project.scripts]
short-term-memory-api = "short_term_memory.cli:api_main"
short-term-memory-worker = "short_term_memory.cli:worker_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
